  <circle cx="400" cy="260" r="200" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6"/>
  <circle cx="400" cy="260" r="130" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.35"/>
  <path d="M120 420C240 220 560 160 700 240" stroke="#2563EB" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="8 8"/>
  <path d="M100 280C260 260 520 380 680 320" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>

